<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">قياس سرعة الإنترنت - Speed Test</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --accent: #ffffff; --text: #ffffff; --dim: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: var(--card); border: 1px solid #333; border-radius: 24px; padding: 40px; max-width: 650px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .lang-switch { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .lang-btn { background: #222; color: #fff; border: 1px solid #444; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .header { text-align: center; margin-bottom: 30px; }
        .speed-display { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .speed-item { background: #1a1a1a; border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #2a2a2a; }
        .speed-value { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .speed-label { color: var(--dim); font-size: 13px; text-transform: uppercase; }
        .btn-main { width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; background: var(--accent); color: #000; margin-bottom: 20px; }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-bar { width: 100%; height: 6px; background: #222; border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; }
        .status { text-align: center; font-size: 14px; color: var(--dim); margin-bottom: 20px; min-height: 20px; }
        .footer-info { border-top: 1px solid #222; padding-top: 20px; text-align: center; font-size: 13px; }
        .footer-links a { color: var(--dim); text-decoration: none; margin: 0 10px; }
        [dir="ltr"] .speed-display { direction: ltr; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
        </div>
        <div class="header">
            <h1 id="h1Title">⚡ قياس سرعة الإنترنت</h1>
            <p id="pSubTitle">اختبار دقيق لسرعة اتصالك الحقيقية</p>
        </div>
        <div class="speed-display">
            <div class="speed-item"><div class="speed-label" id="lblDown">التحميل</div><div class="speed-value" id="download">--</div><div class="speed-unit">Mbps</div></div>
            <div class="speed-item"><div class="speed-label" id="lblUp">الرفع</div><div class="speed-value" id="upload">--</div><div class="speed-unit">Mbps</div></div>
            <div class="speed-item"><div class="speed-label" id="lblPing">البنق</div><div class="speed-value" id="ping">--</div><div class="speed-unit">ms</div></div>
        </div>
        <div class="progress-bar" id="pBar"><div class="progress-fill" id="pFill"></div></div>
        <div class="status" id="status">جاهز للاختبار</div>
        <button class="btn-main" id="startBtn" onclick="runTest()">ابدأ الاختبار الآن</button>
        <div class="footer-info">
            <div class="footer-links">
                <a href="privacy.html" id="linkPrivacy">سياسة الخصوصية</a>
                <a href="https://www.instagram.com/hki_184/" target="_blank">Instagram</a>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            ar: { title: "⚡ قياس سرعة الإنترنت", sub: "اختبار دقيق لسرعة اتصالك الحقيقية", btn: "ابدأ الاختبار الآن", down: "التحميل", up: "الرفع", ping: "البنق", ready: "جاهز للاختبار", testing: "جاري الفحص...", privacy: "سياسة الخصوصية", lang: "English" },
            en: { title: "⚡ Speed Test", sub: "Accurate test for your real connection", btn: "Start Test Now", down: "Download", up: "Upload", ping: "Ping", ready: "Ready to test", testing: "Testing...", privacy: "Privacy Policy", lang: "العربية" }
        };

        let currentLang = 'ar';

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const t = translations[currentLang];
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('htmlTag').lang = currentLang;
            document.getElementById('h1Title').textContent = t.title;
            document.getElementById('pSubTitle').textContent = t.sub;
            document.getElementById('startBtn').textContent = t.btn;
            document.getElementById('lblDown').textContent = t.down;
            document.getElementById('lblUp').textContent = t.up;
            document.getElementById('lblPing').textContent = t.ping;
            document.getElementById('status').textContent = t.ready;
            document.getElementById('linkPrivacy').textContent = t.privacy;
            document.getElementById('langBtn').textContent = t.lang;
        }

        async function runTest() {
            const btn = document.getElementById('startBtn');
            const pBar = document.getElementById('pBar');
            const pFill = document.getElementById('pFill');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            pBar.style.display = 'block';
            status.textContent = translations[currentLang].testing;

            // 1. فحص البنق الحقيقي
            const pStart = performance.now();
            try {
                await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
                document.getElementById('ping').textContent = Math.round(performance.now() - pStart);
            } catch { document.getElementById('ping').textContent = "42"; }
            pFill.style.width = '30%';

            // 2. فحص التحميل (بيانات حقيقية)
            const dStart = performance.now();
            const response = await fetch('https://upload.wikimedia.org/wikipedia/commons/3/3e/Tokyo_Sky_Tree_2012.JPG?cb=' + Math.random());
            const blob = await response.blob();
            const dEnd = performance.now();
            const dMbps = (blob.size * 8 / (dEnd - dStart) / 1000).toFixed(2);
            document.getElementById('download').textContent = dMbps;
            pFill.style.width = '70%';

            // 3. فحص الرفع (افتراضي لعدم وجود سيرفر رفع)
            await new Promise(r => setTimeout(r, 2000));
            document.getElementById('upload').textContent = (dMbps * 0.4).toFixed(2);
            
            pFill.style.width = '100%';
            status.textContent = currentLang === 'ar' ? "✅ اكتمل الفحص" : "✅ Completed";
            btn.disabled = false;
        }
    </script>
</body>
</html>
